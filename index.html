/* projects home */
.pv{overflow:auto;padding-block:24px 40px;padding-left:var(--gx);padding-right:var(--gxr)}
.pv-head{width:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto 20px}
.pv-head .ttl{display:flex;align-items:center;gap:12px;min-width:0}
.pv-head{position:relative}@media (max-width:640px){.pv-head .ttl{flex:1 1 100%;padding-right:54px}.pv-set{position:absolute;top:0;right:0}}.pv-set{width:44px;min-height:44px;padding:0;display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px}.pv-set .ic{width:22px;height:22px}
.ntype{display:flex;gap:10px;width:100%}.ntype button{flex:1;min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);font:700 16px var(--font)}.ntype button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--raised));color:var(--ink)}
.form.pnl .nh{display:none}

.pvs{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}.pvs .sg.thm{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:14px;padding:6px 8px 6px 14px;min-height:54px;flex-wrap:wrap}.pvs .thl{font-size:15px;color:var(--ink)}
.pvs .thb{background:var(--raised)}.pvs .thb button.on{background:var(--accent);color:#1b1208}
.pv-head h1{margin:0;font-size:24px;line-height:30px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.pv-head p{margin:0;font-size:13px;color:var(--muted)}
.pv-body{max-width:1080px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.search{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink)}
.search{border:2px solid var(--muted);border-radius:12px;box-sizing:border-box}
.search:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--raised);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card a.open{display:block;color:inherit;text-decoration:none}
.thumb{height:150px;background:#fff;border-bottom:1px solid var(--line);display:block;width:100%}
.card .meta{padding:12px 14px 6px;display:flex;flex-direction:column;gap:2px}
.card .meta b{font-size:16px;overflow-wrap:anywhere}
.card .meta span{font-size:13px;color:var(--muted)}
.card .acts{display:flex;gap:6px;padding:4px 10px 10px;justify-content:flex-end}
.card .acts .btn{min-height:36px;padding:0 12px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);width:fit-content;margin-top:4px}
.form{border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form input,.form select,.fld input,.fld select{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.form .full{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
/* editor chrome */
.chrome{background:var(--chrome);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:8px var(--gxr) 4px var(--gx);flex-wrap:wrap}
.xi{display:none;width:22px;height:22px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:44px;font-size:17px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.top #pname{flex:1;min-width:140px;height:40px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 10px;font-weight:600;font-size:15px;text-overflow:ellipsis}
.top #pname:hover,.top #pname:focus{border-color:var(--line);background:var(--surface)}
.seg{display:flex;gap:2px;align-items:center;padding:3px;background:var(--soft);border-radius:12px}
.sbtn{width:40px;height:40px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.sbtn:hover:not([disabled]){background:var(--raised)}
.sbtn.on,.sbtn.on:hover:not([disabled]){background:var(--accent);color:#fff}.sbtn.on .ic{stroke:#fff}
.sbtn[disabled]{opacity:.35;cursor:default}
.zl{min-width:46px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.acts-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:6px;padding:4px var(--gxr) 8px var(--gx);overflow-x:auto;scrollbar-width:none;align-items:stretch}
.tools::-webkit-scrollbar{display:none}
.tb{position:relative;min-width:68px;height:58px;padding:6px 8px 4px;border:1.5px solid var(--line);border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none;color:var(--muted)}
.tb .tl{font-size:11.5px;font-weight:600;line-height:1;white-space:nowrap}
.tb:hover{background:var(--soft);color:var(--ink)}
.tb.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tb:hover{border-color:var(--muted)}
.tb .car{position:absolute;right:6px;top:7px;width:9px;height:9px;opacity:.55}
.tb.sel0{position:relative}
.tb.sel0::after{display:none}
.menu{position:fixed;z-index:30;min-width:230px;max-height:70%;overflow:auto;padding:6px;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px var(--shadow)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left}
.menu button:hover,.menu button.on{background:color-mix(in srgb,var(--accent) 20%,var(--raised))}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* desk */
.work{flex:1;min-height:0;display:flex;gap:12px;position:relative;padding:12px var(--gxr) 4px var(--gx)}
#stage{flex:1;min-width:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hint{position:absolute;left:12px;right:12px;top:10px;bottom:10px;align-content:flex-start;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;pointer-events:none}
#hint .msg{background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13.5px;box-shadow:0 2px 10px var(--shadow)}
#hint .hb{display:flex;gap:6px;pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(2px + env(safe-area-inset-bottom,0px));z-index:14;max-width:100%;padding:6px;border-radius:99px;background:var(--raised);border:1px solid var(--line);box-shadow:0 4px 18px var(--shadow)}
@media (max-width:899px){#seg-ur{display:none}
 .chrome{position:relative}
 .acts-top{display:none!important}
 body.hm-open .acts-top{display:flex!important;position:absolute;left:8px;right:8px;top:calc(100% + 6px);z-index:40;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px var(--shadow)}
 body.hm-open .acts-top .sbtn{width:46px;height:46px}
 .tb.tb-menu{display:flex}.tb.tb-menu.on{background:var(--soft);border-color:var(--ink);color:var(--ink)}}
.tb-menu{display:none}
@media (max-width:899px){#hint .hb{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
#hint .hb .btn{min-height:40px;border-radius:99px}
#tin{position:absolute;z-index:5;height:40px;width:200px;padding:0 10px;border:2px solid var(--sel);border-radius:8px;background:var(--raised);color:var(--ink)}
#panel{width:304px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--raised);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
#panel h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:11px}
.tabs button{flex:1;height:38px;border:0;border-radius:8px;background:none;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;border-bottom:1px solid var(--line);font-size:14.5px}
.row b{font-family:var(--mono);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:2px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.sw button i{width:26px;height:26px;border-radius:50%;display:block;border:1px solid var(--line)}
.sw button.on{border-color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:90px}
.lay{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 4px 0 10px;border-radius:10px}
.lay:hover{background:var(--soft)}
.lay .nm{flex:1;min-width:0}
.lay .iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)}
.lay .iconbtn:hover{color:var(--ink);background:var(--raised)}
/* status */
.status{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap;padding:4px var(--gxr) 8px var(--gx);font-size:12.5px;color:var(--muted)}
.sg{display:flex;align-items:center;gap:14px}
.status .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.status .sg.fl,.status.open .sg.fl{display:none!important}
.thb{display:inline-flex;padding:3px;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.thb button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:0 14px;min-height:36px;border-radius:9px;cursor:pointer}
.thb button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.thb button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.thl{font-size:13px}
.status:not(.open) .thm{display:none}
.status.open .thm{width:100%;justify-content:space-between}
.status select{height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);max-width:150px}
.ls{display:none}.chk{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.fl{gap:6px}

#cpk .cpk-sl{display:flex;flex-direction:column;gap:12px;padding:4px 2px}
#cpk .cpk-sl label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
#cpk .cpk-sl input[type=range]{-webkit-appearance:none;appearance:none;height:26px;border-radius:13px;border:1px solid var(--line);padding:0;margin:0;touch-action:pan-x}
#cpk .cpk-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #444;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#cpk .cpk-sl input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #444}
#cpk .cpk-f{display:flex;gap:10px;align-items:center}
#cpk .cpk-f i{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:block;flex:none}
#cpk .cpk-hex{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font:600 15px 'JetBrains Mono',monospace;text-transform:lowercase}
@media (min-width:900px){#cpk{left:auto;right:124px;top:84px;bottom:auto;transform:none}}
@media (max-width:899px){
  .work{padding:8px 0 0}
  #stage{border-radius:0;border-left:0;border-right:0}
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:50%;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px var(--shadow);padding-left:var(--gx);padding-right:var(--gxr);z-index:12}
  #panel[hidden]{display:none}
  .hide-sm{display:none}
}
@media (max-width:640px){.status{flex-wrap:nowrap;overflow-x:auto;gap:12px;padding:2px 12px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none}.status::-webkit-scrollbar{display:none}.status .sg{flex:none;gap:12px}.status .sp,#st-xy,#st-save,#st-sc,.lf{display:none}.status{justify-content:space-between}.status .sg{gap:10px}.status select{max-width:104px}.status .fl .chk{font-size:0;gap:0}.status select{font-size:14px;height:34px}.status .chk{font-size:12.5px;white-space:nowrap;gap:4px}.ls{display:inline}.status .fl .chk select{font-size:14px}.top #pname{order:5;flex:1 1 100%}.brand span{display:none}}
@media (min-width:900px){#panel{position:absolute;right:14px;top:78px;bottom:14px;width:320px;z-index:12;box-shadow:0 12px 36px var(--shadow)}#panel[hidden]{display:none}.work{position:relative}}
@media (max-width:899px){.top{flex-wrap:nowrap!important;gap:10px!important}.top #pname{order:0!important;flex:1 1 auto!important;flex-basis:0!important;min-width:0!important;height:44px;font-family:inherit;font-weight:700!important;font-size:19px!important;letter-spacing:.01em;color:var(--ink);padding:0 6px!important}}
#np-upd.upd-new{background:#EF7530;border-color:#EF7530;color:#fff;animation:updp 1.1s ease-in-out infinite}@keyframes updp{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,117,48,.6)}50%{transform:scale(1.08);box-shadow:0 0 0 9px rgba(239,117,48,0)}}@media (prefers-reduced-motion:reduce){#np-upd.upd-new{animation:none;box-shadow:0 0 0 3px rgba(239,117,48,.55)}}
#pn-cvw .pnctx{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px)}#pn-cvw .pnctx:not([hidden]){animation:pnup .2s ease-out}@keyframes pnup{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}@media (prefers-reduced-motion:reduce){#pn-cvw .pnctx:not([hidden]){animation:none}}
@media (min-width:900px){#pn-cvw .pnctx{top:50%;bottom:auto;left:auto;right:14px;transform:translateY(-50%);flex-direction:column;width:auto;max-width:none;max-height:calc(100% - 140px);overflow-x:hidden;overflow-y:auto;min-width:130px}#pn-cvw .pnctx:not([hidden]){animation:pnrt .2s ease-out}@keyframes pnrt{from{opacity:0;transform:translate(16px,-50%)}to{opacity:1;transform:translate(0,-50%)}}.pnctx button{justify-content:flex-start;white-space:nowrap}}@media (min-width:900px) and (prefers-reduced-motion:reduce){#pn-cvw .pnctx:not([hidden]){animation:none}}
@media (hover:hover){#pn-scr .pnctx button{transition:box-shadow .12s,background .12s}#pn-scr .pnctx button:hover{box-shadow:inset 0 0 0 2px #7fa8f0;background:#26323f}#pn-scr .pnctx button.dg:hover{box-shadow:inset 0 0 0 2px #ff8a80}}
</style>

/* ===== ҳисоби маҳаллӣ (бе сервер) ===== */
const AK='oryo-acct',AS='oryo-sess';
const AUTH_ON=()=>typeof STANDALONE!=='undefined'&&STANDALONE&&!!(window.crypto&&crypto.subtle);
function getAcct(){try{return JSON.parse(localStorage.getItem(AK))}catch(e){return null}}
function loggedIn(){try{return sessionStorage.getItem(AS)==='1'||localStorage.getItem(AS)==='1'}catch(e){return false}}
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function hashPw(pw,saltB){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(saltB),iterations:150000,hash:'SHA-256'},k,256)))}
const rndSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
function mkCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));let c='';r.forEach((v,i)=>{c+=A[v%A.length];if(i%4===3&&i<11)c+='-'});return c}
let AMODE='new';
function authSet(m){AMODE=m;const a=getAcct(),V=(id,on)=>{$(id).hidden=!on};
 V('#au-l-email',m==='new'||m==='login');V('#au-l-code',m==='reset');V('#au-l-pw',true);V('#au-l-pw2',m==='new'||m==='reset');V('#au-l-rem',m==='login'||m==='new'||m==='reset');
 $('#au-err').hidden=true;$('#au-pw').value='';$('#au-pw2').value='';$('#au-code').value='';
 $('#au-pw').autocomplete=m==='login'?'current-password':'new-password';
 $('#au-sub').textContent=m==='new'?'Ҳисоби нав созед':m==='login'?'Ба барнома ворид шавед':'Тағйири парол';
 $('#au-pwl').textContent=m==='reset'?'Пароли нав':m==='new'?'Парол созед (камаш 6 аломат)':'Парол';
 $('#au-go').textContent=m==='new'?'Сохтани ҳисоб':m==='login'?'Ворид шудан':'Нигоҳ доштани пароли нав';
 const a1=$('#au-alt1'),a2=$('#au-alt2');a1.hidden=a2.hidden=false;
 if(m==='login'){a1.textContent='Парол фаромӯш шуд';a1.dataset.m='reset';a2.hidden=true}
 else if(m==='reset'){a1.textContent='Бозгашт';a1.dataset.m='login';a2.textContent='Рамз нест';a2.dataset.m='wipe'}
 else{a1.hidden=true;a2.hidden=true}
 if(a&&m==='login')$('#au-email').value=a.email||''
 const pk=!!(a&&a.pk&&m==='login');if(pk){V('#au-l-email',false);V('#au-l-pw',false);V('#au-l-rem',false);a1.hidden=true;$('#au-sub').textContent='Ба барнома ворид шавед'}$('#au-go').hidden=pk;if(typeof fidUi==='function')try{fidUi()}catch(e){}}
/* Face ID / Touch ID: WebAuthn (platform authenticator). Танҳо дар ҳамин дастгоҳ. */
const FK='oryo-fid',FNO='oryo-fid-no';
const fidGet=()=>{try{return JSON.parse(localStorage.getItem(FK))}catch(e){return null}};
let FID_OK=false;
try{if((location.protocol==='https:'||location.hostname==='localhost')&&window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(v=>{FID_OK=!!v;fidUi()}).catch(()=>{})}catch(e){}
function fidUi(){const f=fidGet(),a=getAcct(),on=FID_OK&&f&&a&&f.email===a.email;const b=$('#au-fid');if(b)b.hidden=!(FID_OK&&((on&&AMODE==='login')||(!a&&AMODE==='new')));const t=$('#b-fid');if(t){t.hidden=!(AUTH_ON()&&a&&FID_OK);t.textContent=on?'Face ID: фаъол':'Face ID: хомӯш';t.classList.toggle('on',!!on)}}
async function fidEnable(){const a=getAcct();if(!a||!FID_OK)return false;try{const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'ORYO',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:a.email,displayName:a.email},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
  localStorage.setItem(FK,JSON.stringify({id:b64(new Uint8Array(cr.rawId)),email:a.email}));localStorage.removeItem(FNO);fidUi();toast('Face ID фаъол шуд');return true}catch(e){toast('Face ID фаъол нашуд');return false}}
async function fidLogin(){const f=fidGet();if(!f)return;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64(f.id)}],userVerification:'required',timeout:60000}});authDone(true)}catch(e){authErr('Face ID кор накард. Бо парол ворид шавед.')}}
async function fidMain(){const a=getAcct(),f=fidGet();
 if(f&&a&&f.email===a.email){fidLogin();return}
 if(a){authErr('Аввал бо парол ворид шавед ва Face ID-ро фаъол кунед.');return}
 try{localStorage.setItem(AK,JSON.stringify({email:'iCloud',pk:1,t:Date.now()}))}catch(e){return}
 const ok=await fidEnable();if(ok){authDone(true)}else{try{localStorage.removeItem(AK)}catch(e){}authErr('Ҳисоб сохта нашуд. Дубора кӯшиш кунед.')}}
function offerFid(){try{if(!FID_OK||fidGet()||localStorage.getItem(FNO)||!getAcct()||!AUTH_ON())return}catch(e){return}
 openModal('<h2>Face ID-ро фаъол мекунед?</h2><p style="margin:0">Дафъаи дигар бе парол, бо Face ID ворид мешавед. Ин танҳо дар ҳамин дастгоҳ кор мекунад.</p><div class="btns"><button class="btn" type="button" id="fid-no">Ҳозир не</button><button class="btn primary" type="button" id="fid-yes">Фаъол кардан</button></div>');
 $('#fid-no').onclick=()=>{try{localStorage.setItem(FNO,'1')}catch(e){}closeModal()};$('#fid-yes').onclick=async()=>{closeModal();await fidEnable()}}
document.addEventListener('click',e=>{if(e.target.closest('#au-fid')){fidMain();return}if(e.target.closest('#b-fid')){if(getAcct()&&getAcct().pk){toast('Ҳисоби iCloud бе Face ID кор намекунад');return}if(fidGet()){try{localStorage.removeItem(FK);localStorage.setItem(FNO,'1')}catch(_){}fidUi();toast('Face ID хомӯш шуд')}else fidEnable()}});
function showAuth(){$('#v-projects').hidden=true;$('#v-editor').hidden=true;$('#v-auth').hidden=false;authSet(getAcct()?'login':'new');fidUi();document.title='ORYO';applyTheme()}
function authErr(t){const e=$('#au-err');e.textContent=t;e.hidden=false}
function authDone(rem){try{sessionStorage.setItem(AS,'1');if(rem)localStorage.setItem(AS,'1');else localStorage.removeItem(AS)}catch(e){}$('#v-auth').hidden=true;authInfo();fidUi();route();setTimeout(offerFid,700)}
function authInfo(){const a=getAcct(),on=AUTH_ON()&&a;fidUi();$('#sg-acc').hidden=!on;if(on)$('#acc-l').textContent=a.email}
function showCode(code,rem){openModal('<h2>Рамзи барқарорӣ</h2><p style="margin:0">Ин рамзро ҳатман ҷое нависед ё скриншот гиред. Агар паролро фаромӯш кунед, танҳо бо ҳамин рамз онро иваз мекунед. Он дубора нишон дода намешавад.</p><p style="font:700 22px ui-monospace,monospace;letter-spacing:.06em;text-align:center;margin:12px 0;user-select:all">'+code+'</p><div class="btns"><button class="btn" type="button" id="rc-copy">Нусха кардан</button><button class="btn primary" type="button" id="rc-ok">Навишт, идома</button></div>');
 $('#rc-copy').onclick=()=>{try{navigator.clipboard.writeText(code);toast('Нусха шуд')}catch(e){}};$('#rc-ok').onclick=()=>{closeModal();authDone(rem)}}
$('#au-form').addEventListener('submit',async e=>{e.preventDefault();const em=$('#au-email').value.trim().toLowerCase(),pw=$('#au-pw').value,pw2=$('#au-pw2').value,rem=$('#au-rem').checked,a=getAcct();
 try{
 if(AMODE==='new'){if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return authErr('Почтаро дуруст нависед');if(pw.length<6)return authErr('Парол камаш 6 аломат');if(pw!==pw2)return authErr('Паролҳо мувофиқ нестанд');
  const salt=rndSalt(),code=mkCode(),salt2=rndSalt();localStorage.setItem(AK,JSON.stringify({email:em,salt,hash:await hashPw(pw,salt),salt2,rhash:await hashPw(code.replace(/-/g,''),salt2)}));showCode(code,rem)}
 else if(AMODE==='login'){if(!a)return authSet('new');if(em!==a.email)return authErr('Почта нодуруст аст');if(await hashPw(pw,a.salt)!==a.hash)return authErr('Парол нодуруст аст');authDone(rem)}
 else if(AMODE==='reset'){const code=$('#au-code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!a)return authSet('new');if(await hashPw(code,a.salt2)!==a.rhash)return authErr('Рамзи барқарорӣ нодуруст аст');if(pw.length<6)return authErr('Пароли нав камаш 6 аломат');if(pw!==pw2)return authErr('Паролҳо мувофиқ нестанд');
  const salt=rndSalt();a.salt=salt;a.hash=await hashPw(pw,salt);localStorage.setItem(AK,JSON.stringify(a));toast('Парол иваз шуд');authDone(rem)}
 }catch(err){authErr('Хатогӣ: '+(err&&err.message||err))}});
$('#au-alt1').addEventListener('click',e=>authSet(e.currentTarget.dataset.m));
$('#au-alt2').addEventListener('click',e=>{if(e.currentTarget.dataset.m!=='wipe')return;openModal('<h2>Ҳисобро тоза кардан?</h2><p style="margin:0">Почта ва парол нест мешаванд ва ҳисоби нав месозед. Лоиҳаҳо дар ин дастгоҳ мемонанд.</p><div class="btns"><button class="btn danger" type="button" id="wp-ok">Тоза кардан</button><button class="btn" type="button" data-close>Бекор</button></div>');$('#wp-ok').onclick=()=>{try{localStorage.removeItem(AK);localStorage.removeItem(AS);sessionStorage.removeItem(AS)}catch(e){}closeModal();authSet('new')}});
$('#b-logout').addEventListener('click',()=>{try{localStorage.removeItem(AS);sessionStorage.removeItem(AS)}catch(e){}setOpen(false);document.body.classList.remove('hm-open');showAuth()});
authInfo();
initDB();
if(location.hash==='#editor'&&!DB.current)location.hash='projects';

document.addEventListener('click',e=>{const m=e.target.closest('#b-menu');if(m){document.body.classList.toggle('hm-open');m.classList.toggle('on',document.body.classList.contains('hm-open'));m.setAttribute('aria-expanded',document.body.classList.contains('hm-open'));return}
 if(document.body.classList.contains('hm-open')){const inP=e.target.closest('.acts-top');if(inP&&e.target.closest('button')||!inP){document.body.classList.remove('hm-open');const mb=document.querySelector('#b-menu');if(mb){mb.classList.remove('on');mb.setAttribute('aria-expanded','false')}}}});
const APP_V=284;
(function(){const V=APP_V;const st=document.createElement('style');st.textContent='#upd{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:rgba(10,12,16,.94);color:#fff;font:600 18px system-ui,sans-serif;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}#upd[hidden]{display:none}#upd small{display:block;font:400 14px system-ui,sans-serif;opacity:.75;max-width:320px}#upd button{border:0;border-radius:12px;background:#EF7530;color:#fff;font:700 17px system-ui,sans-serif;padding:14px 28px;min-height:48px;cursor:pointer}';document.head.appendChild(st);
const bar=document.createElement('div');bar.id='upd';bar.hidden=true;bar.setAttribute('role','alert');bar.innerHTML='<div>Версияи нав омад<small>Барои ворид шудан аввал барномаро нав кунед.</small></div><button type="button" id="upd-go">Нав кардан</button>';document.body.appendChild(bar);
async function check(){try{const ac=new AbortController();setTimeout(()=>ac.abort(),6000);const r=await fetch('index.html?_='+Date.now(),{cache:'no-store',signal:ac.signal});if(!r.ok)return;const t=await r.text();const m=/const APP_V=(\d+)/.exec(t);if(m&&+m[1]>V){setTimeout(()=>{const u=document.getElementById('np-upd');if(u)u.classList.add('upd-new')},1000)}}catch(e){}}
document.getElementById('upd-go').onclick=async()=>{const b=document.getElementById('upd-go');b.disabled=true;b.textContent='…';try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));if(navigator.serviceWorker){const rg=await navigator.serviceWorker.getRegistrations();await Promise.all(rg.map(g=>g.unregister()))}}catch(e){}location.replace(location.pathname+'?v='+Date.now())};
const sv=document.getElementById('sg-ver');if(sv){sv.hidden=false;document.getElementById('ver-l').textContent='Версия '+V;document.getElementById('b-upd').onclick=()=>document.getElementById('upd-go').click()}
check();document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});setInterval(check,300000)})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
