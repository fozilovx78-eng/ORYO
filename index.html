<!doctype html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Студия расм: барномаи веб барои кашидани нақша ва схемаҳо бо андозаҳои дақиқ.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Студия расм">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Студия расм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one white top chrome (brand, project name, actions, tool dock) over a cool grey desk;
   the drawing sheet and the properties card sit on the desk; status line at the bottom. */
[hidden]{display:none!important}
:root{
  --bg:#EDF0F4;--chrome:#FFFFFF;--surface:#FFFFFF;--raised:#FFFFFF;--soft:#E7ECF1;
  --ink:#16212C;--muted:#566474;--line:#D6DCE3;
  --accent:#EF7530;--accent-strong:#B8470A;--on-accent:#14110D;
  --dim:#1F5FBF;--grid:#EBF0F5;--grid2:#D8E1EA;--danger:#B3261E;--sel:#1F5FBF;--shadow:rgba(22,33,44,.18);
  --c-ink:#16212C;--c-accent:#EF7530;--c-blue:#1F5FBF;--c-green:#2E7D4F;--c-red:#C0392B;
  --font:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gx:max(16px,env(safe-area-inset-left,0px));--gxr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B;--chrome:#18212A;--surface:#161E26;--raised:#1E2833;--soft:#26323F;
  --ink:#E8EEF4;--muted:#9AA9B8;--line:#2E3B49;
  --accent:#F28A4B;--accent-strong:#F6A774;--on-accent:#14110D;
  --dim:#7FB0FF;--grid:#1C2630;--grid2:#2A3744;--danger:#FF8A80;--sel:#7FB0FF;--shadow:rgba(0,0,0,.5);
  --c-ink:#E8EEF4;--c-accent:#F28A4B;--c-blue:#6FA3FF;--c-green:#6CC48F;--c-red:#FF8A7A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B;--chrome:#18212A;--surface:#161E26;--raised:#1E2833;--soft:#26323F;
  --ink:#E8EEF4;--muted:#9AA9B8;--line:#2E3B49;
  --accent:#F28A4B;--accent-strong:#F6A774;--on-accent:#14110D;
  --dim:#7FB0FF;--grid:#1C2630;--grid2:#2A3744;--danger:#FF8A80;--sel:#7FB0FF;--shadow:rgba(0,0,0,.5);
  --c-ink:#E8EEF4;--c-accent:#F28A4B;--c-blue:#6FA3FF;--c-green:#6CC48F;--c-red:#FF8A7A;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;overflow:hidden}
*{box-sizing:border-box}
button,input,select,summary{font:inherit;color:inherit}
button,summary{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#app{height:100%;position:relative}
.view{height:100%;display:flex;flex-direction:column;min-height:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{min-height:44px;min-width:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.4;cursor:default}
.mark{width:30px;height:30px;flex:none;display:block}
/* projects home */
.pv{overflow:auto;padding-block:24px 40px;padding-left:var(--gx);padding-right:var(--gxr)}
.pv-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto 20px}
.pv-head .ttl{display:flex;align-items:center;gap:12px;min-width:0}
.pv-head h1{margin:0;font-size:24px;line-height:30px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.pv-head p{margin:0;font-size:13px;color:var(--muted)}
.pv-body{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.search{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--raised);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card a.open{display:block;color:inherit;text-decoration:none}
.thumb{height:150px;background:#fff;border-bottom:1px solid var(--line);display:block;width:100%}
.card .meta{padding:12px 14px 6px;display:flex;flex-direction:column;gap:2px}
.card .meta b{font-size:16px;overflow-wrap:anywhere}
.card .meta span{font-size:13px;color:var(--muted)}
.card .acts{display:flex;gap:6px;padding:4px 10px 10px;justify-content:flex-end}
.card .acts .btn{min-height:36px;padding:0 12px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);width:fit-content;margin-top:4px}
.form{border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form input,.form select,.fld input,.fld select{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.form .full{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
/* editor chrome */
.chrome{background:var(--chrome);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:8px var(--gxr) 4px var(--gx);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:44px;font-size:17px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.top #pname{flex:1;min-width:140px;height:40px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 10px;font-weight:600;font-size:15px;text-overflow:ellipsis}
.top #pname:hover,.top #pname:focus{border-color:var(--line);background:var(--surface)}
.seg{display:flex;gap:2px;align-items:center;padding:3px;background:var(--soft);border-radius:12px}
.sbtn{width:40px;height:40px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.sbtn:hover:not([disabled]){background:var(--raised)}
.sbtn[disabled]{opacity:.35;cursor:default}
.zl{min-width:46px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.acts-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:2px;padding:4px var(--gxr) 8px var(--gx);overflow-x:auto;scrollbar-width:none;align-items:stretch}
.tools::-webkit-scrollbar{display:none}
.tb{position:relative;min-width:68px;height:58px;padding:6px 8px 4px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none;color:var(--muted)}
.tb .tl{font-size:11.5px;font-weight:600;line-height:1;white-space:nowrap}
.tb:hover{background:var(--soft);color:var(--ink)}
.tb.on{background:var(--accent);color:var(--on-accent)}
.tb .car{position:absolute;right:6px;top:7px;width:9px;height:9px;opacity:.55}
.tb.sel0{margin-right:6px;position:relative}
.tb.sel0::after{content:"";position:absolute;right:-4px;top:12px;bottom:12px;width:1px;background:var(--line)}
.menu{position:fixed;z-index:30;min-width:230px;max-height:70%;overflow:auto;padding:6px;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px var(--shadow)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left}
.menu button:hover,.menu button.on{background:color-mix(in srgb,var(--accent) 20%,var(--raised))}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* desk */
.work{flex:1;min-height:0;display:flex;gap:12px;position:relative;padding:12px var(--gxr) 4px var(--gx)}
#stage{flex:1;min-width:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hint{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;pointer-events:none}
#hint .msg{background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13.5px;box-shadow:0 2px 10px var(--shadow)}
#hint .hb{display:flex;gap:6px;pointer-events:auto}
#hint .hb .btn{min-height:40px;border-radius:99px}
#tin{position:absolute;z-index:5;height:40px;width:200px;padding:0 10px;border:2px solid var(--sel);border-radius:8px;background:var(--raised);color:var(--ink)}
#panel{width:304px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--raised);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
#panel h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:11px}
.tabs button{flex:1;height:38px;border:0;border-radius:8px;background:none;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;border-bottom:1px solid var(--line);font-size:14.5px}
.row b{font-family:var(--mono);font-weight:500;font-size:13.5px;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sw{display:flex;gap:4px}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.sw button i{width:26px;height:26px;border-radius:50%;display:block;border:1px solid var(--line)}
.sw button.on{border-color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:90px}
.lay{display:flex;align-items:center;gap:2px;min-height:48px;padding:0 4px 0 10px;border-radius:10px}
.lay:hover{background:var(--soft)}
.lay .nm{flex:1;min-width:0}
.lay .iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)}
.lay .iconbtn:hover{color:var(--ink);background:var(--raised)}
/* status */
.status{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap;padding:4px var(--gxr) 8px var(--gx);font-size:12.5px;color:var(--muted)}
.sg{display:flex;align-items:center;gap:14px}
.status .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.status select{height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);max-width:150px}
.ls{display:none}.chk{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.fl{gap:6px}
.flm{position:relative}
.flm summary{list-style:none;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-weight:700}
.flm summary::-webkit-details-marker{display:none}
.flpop{position:absolute;bottom:calc(100% + 6px);left:0;z-index:25;min-width:200px;padding:6px;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px var(--shadow)}
.flpop button{display:block;width:100%;height:44px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left}
.flpop button:hover:not([disabled]){background:var(--soft)}
.flpop button[disabled]{opacity:.4;cursor:default}
.flpop .dng{color:var(--danger)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,22,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
#modal h2{margin:0;font-size:20px}
#modal textarea{width:100%;height:140px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:12px;padding:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%}
@media (max-width:899px){
  .work{padding:8px 0 0}
  #stage{border-radius:0;border-left:0;border-right:0}
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:50%;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px var(--shadow);padding-left:var(--gx);padding-right:var(--gxr);z-index:12}
  #panel[hidden]{display:none}
  .hide-sm{display:none}
}
@media (max-width:640px){.status{flex-wrap:nowrap;overflow-x:auto;gap:12px;padding:2px 12px calc(6px + env(safe-area-inset-bottom));scrollbar-width:none}.status::-webkit-scrollbar{display:none}.status .sg{flex:none;gap:12px}.status .sp,#st-xy,#st-save,#st-sc,.lf{display:none}.status{justify-content:space-between}.status .sg{gap:10px}.status select{max-width:104px}.status .fl .chk{font-size:0;gap:0}.status select{font-size:14px;height:34px}.status .chk{font-size:12.5px;white-space:nowrap;gap:4px}.ls{display:inline}.status .fl .chk select{font-size:14px}.top #pname{order:5;flex:1 1 100%}.brand span{display:none}}
@media (min-width:900px){#panel[hidden]{display:flex}#btn-panel{display:none}}
</style>
</head>
<body>
<noscript>Барои кор кардани «Студия расм» JavaScript лозим аст.</noscript>
<div id="app">
<section id="v-projects" class="view pv" aria-label="Лоиҳаҳо">
  <div class="pv-head"><div class="ttl"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#EF7530"/><path d="M130 140H382V268H300V380H130Z" fill="none" stroke="#14110D" stroke-width="34" stroke-linejoin="round"/></svg><div><h1>Студия расм</h1><p>Нақша ва схемаҳо бо андозаҳои дақиқ</p></div></div><button class="btn primary" id="np-open" type="button">+ Лоиҳаи нав</button></div>
  <div class="pv-body">
    <form class="form" id="np-form" hidden>
      <label>Номи лоиҳа<input id="np-name" value="Хонаи нав" maxlength="60"></label>
      <label>Шаблон<select id="np-tpl"><option value="empty">Холӣ</option><option value="room">Ҳуҷраи росткунҷа</option></select></label>
      <label>Дарозӣ (м)<input id="np-w" type="number" min="1" max="100" step="0.1" value="6"></label>
      <label>Васеӣ (м)<input id="np-h" type="number" min="1" max="100" step="0.1" value="4"></label>
      <div class="full"><button class="btn primary" type="submit">Сохтан</button><button class="btn" type="button" id="np-cancel">Бекор</button></div>
    </form>
    <input class="search" id="q" type="search" placeholder="Ҷустуҷӯи лоиҳа" aria-label="Ҷустуҷӯи лоиҳа">
    <div class="grid" id="plist"></div>
  </div>
</section>
<section id="v-editor" class="view" hidden aria-label="Муҳаррир">
  <div class="chrome">
  <header class="top">
    <a class="brand" href="#projects" aria-label="Ба рӯйхати лоиҳаҳо"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#EF7530"/><path d="M130 140H382V268H300V380H130Z" fill="none" stroke="#14110D" stroke-width="34" stroke-linejoin="round"/></svg><span>Студия расм</span></a>
    <input id="pname" aria-label="Номи лоиҳа" maxlength="60">
    <div class="acts-top">
      <div class="seg"><button class="sbtn" id="b-undo" type="button" aria-label="Бекор кардан"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 010 8h-3"/></svg></button><button class="sbtn" id="b-redo" type="button" aria-label="Такрор"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 000 8h3"/></svg></button></div>
      <div class="seg hide-sm"><button class="sbtn" id="b-zo" type="button" aria-label="Хурд кардан"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><span class="zl" id="zlab">100%</span><button class="sbtn" id="b-zi" type="button" aria-label="Калон кардан"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button><button class="sbtn" id="b-fit" type="button" aria-label="Ҳама дар экран"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
      <button class="btn" id="btn-panel" type="button" aria-label="Панел"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="btn primary" id="b-exp" type="button">Содир кардан</button>
    </div>
  </header>
  <nav class="tools" id="tools" aria-label="Инструментҳо"></nav>
</div>
  <div class="work">
    <main id="stage"><svg id="cv" role="img" aria-label="Майдони кашидани нақша"></svg><div id="hint" hidden></div><input id="tin" hidden aria-label="Матн"></main>
    <aside id="panel" aria-label="Панел"></aside>
  </div>
  <footer class="status">
    <div class="sg"><span class="mono" id="st-xy">0.00 м · 0.00 м</span><span class="mono" id="st-sc">Масштаб 1 : 50</span></div>
    <div class="sg fl"><label class="chk">Ошёна<select id="fl-sel" aria-label="Ошёна"></select></label><details class="flm"><summary aria-label="Амалҳои ошёна">⋯</summary><div class="flpop"><button type="button" id="fl-add">+ Ошёнаи нав</button><button type="button" id="fl-dup">Нусхаи ошёна</button><button type="button" id="fl-ren">Номи ошёна</button><button type="button" id="fl-del" class="dng">Нест кардани ошёна</button></div></details></div>
    <div class="sg"><label class="chk"><input type="checkbox" id="o-snap" checked><span class="lf">Часпидан</span><span class="ls">Часп</span></label><label class="chk"><input type="checkbox" id="o-ortho" checked><span class="lf">Кунҷи 90°</span><span class="ls">90°</span></label><label class="chk"><input type="checkbox" id="o-dims" checked><span class="lf">Андозаҳо</span><span class="ls">Андоза</span></label></div>
    <span class="sp"></span><span id="st-save">Захира шуд</span>
  </footer>
</section>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var curFloor=0;const FO=()=>objs.filter(o=>(o.fl||0)===curFloor);const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='studio-rasm-v1';
let mem=null;
function loadDB(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function saveDB(db){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){return false}}
const CX={ink:'#1E1A14',accent:'#EF7530',blue:'#1F5FBF',green:'#2E7D4F',red:'#C0392B'};

$('#panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const o=curObj();
 if(b.dataset.p){ptab=b.dataset.p;renderPanel();return}
 if(b.dataset.lv){layers[b.dataset.lv].vis=!layers[b.dataset.lv].vis;renderWorld();renderPanel();schedSave();return}
 if(b.dataset.ll){layers[b.dataset.ll].lock=!layers[b.dataset.ll].lock;renderWorld();renderPanel();schedSave();return}
 if(!o)return;
 if(b.dataset.col){o.color=b.dataset.col;changed(true);return}
 const a=b.dataset.act;if(a==='room'){makeRoom(o)}else if(a==='dim'){toggleDim(o)}else if(a==='del'){objs=objs.filter(q=>q.id!==sel);sel=null;changed(true)}else if(a==='dup')dupSel();
 else if(a==='rotm'||a==='rotp'){o.rot=((o.rot||0)+(a==='rotp'?90:-90)+360)%360;if(o.at){const q=objs.find(w=>w.id===o.at.id);if(q){const n=q.pts.length;o.at.rr=((o.rot-segBase(q.pts[o.at.i],q.pts[(o.at.i+1)%n]))%360+360)%360}}changed(true)}
 else if(a==='sm'||a==='lg'){const f=a==='lg'?1.25:.8;if(o.w||o.hh){const S=SYM[o.kind],K=symK(o);o.w=Math.round(S.w*K[0]*f);o.hh=Math.round(S.h*K[1]*f)}else o.scale=Math.min(4,Math.max(.25,(o.scale||1)*f));changed(true)}});
$('#panel').addEventListener('input',e=>{const o=curObj(),t=e.target;if(!o)return;
 if(t.id==='p-sw'){o.sw=+t.value;t.parentNode.firstChild.nodeValue='Ғафсии хат: '+o.sw+' px';renderWorld();schedSave()}
 else if(t.id==='p-text'){o.text=t.value;renderWorld();schedSave()}
 else if(t.id==='p-name'){o.name=t.value;renderWorld();schedSave()}});
$('#panel').addEventListener('change',e=>{const o=curObj(),t=e.target;if(!o)return;
 if(t.id==='p-sw'||t.id==='p-text'||t.id==='p-name'){changed(true)}
 else if(t.classList&&t.classList.contains('seg-in')){if(setSeg(o,+t.dataset.seg,(+t.value||0)*100))changed(true)}
 else if(t.id==='p-sw2'){o.w=Math.min(1000,Math.max(10,+t.value||SYM[o.kind].w));changed(true)}
 else if(t.id==='p-sh2'){o.hh=Math.min(1000,Math.max(4,+t.value||SYM[o.kind].h));changed(true)}
 else if(t.id==='p-th'){o.th=Math.min(60,Math.max(5,+t.value||15));changed(true)}
 else if(t.id==='p-ws'){o.ws=t.value;delete o.hatch;changed(true)}
 else if(t.id==='p-size'){o.size=Math.min(200,Math.max(6,+t.value||24));changed(true)}
 else if(t.id==='p-layer'){o.layer=t.value;changed(true)}
 else if(t.id==='p-closed'){o.closed=t.checked;changed(true)}
 else if(t.id==='p-nodim'){o.nodim=!t.checked;changed(true)}
 else if(t.id==='p-len'){const v=+t.value*100;if(v>0){const a=o.pts[0],b=o.pts[1],d=dist(a,b)||1;o.pts[1]=[a[0]+(b[0]-a[0])/d*v,a[1]+(b[1]-a[1])/d*v];changed(true)}}});
/* ===== modal ===== */
function openModal(h){const m=$('#modal');m.innerHTML='<div class="box" role="dialog" aria-modal="true">'+h+'</div>';m.hidden=false;const f=m.querySelector('button,input');if(f)f.focus()}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function askClear(){openModal('<h2>Тоза кардани ҳама?</h2><p style="margin:0">Ҳамаи объектҳои лоиҳа хориҷ карда мешаванд. Баъд аз ин бо тугмаи «Бекор кардан» барқарор мекунед.</p><div class="btns"><button class="btn danger" type="button" id="clr-ok">Тоза кардан</button><button class="btn" type="button" data-close>Бекор</button></div>');
 $('#clr-ok').onclick=()=>{objs=[];sel=null;draft=null;closeModal();changed(true)}}
/* ===== export ===== */
const STANDALONE=true;let DL=null;(async()=>{try{if(window.claude&&claude.use)DL=await claude.use('downloads')}catch(e){DL=null}})();
const slug=()=>(P.name||'nakshsa').replace(/[\\/:*?"<>|]+/g,'').trim()||'nakshsa';
async function saveFile(name,data){if(!DL&&STANDALONE){try{const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Файл омода шуд');return true}catch(e){return false}}if(!DL)return false;try{await DL.save({filename:name,data:data});toast('Файл омода шуд');return true}catch(e){if(e&&e.code!=='declined')toast('Захира нашуд. Матнро нусха кунед.');return true}}
function pngBlob(ex){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=ex.w;c.height=ex.h;c.getContext('2d').drawImage(im,0,0,ex.w,ex.h);c.toBlob(b=>b?res(b):rej(),'image/png')};im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ex.svg)})}
async function savePdf(ex){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('PDF сохта намешавад: китобхона бор нашуд');return}
 try{const bl=await pngBlob({svg:ex.svg,w:ex.w*2,h:ex.h*2}),url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(bl)});
  const land=ex.cw>=ex.ch,pw=land?297:210,ph=land?210:297,m=10,k=Math.min((pw-2*m)/ex.cw,(ph-2*m-8)/ex.ch),w=ex.cw*k,h=ex.ch*k,doc=new J({orientation:land?'l':'p',unit:'mm',format:'a4'});
  doc.addImage(url,'PNG',(pw-w)/2,m,w,h);doc.setFontSize(9);doc.text('1 : '+Math.round(10/k),pw-m,ph-m,{align:'right'});
  if(!(await saveFile(slug()+'.pdf',doc.output('arraybuffer'))))toast('Захираи файл дар ин намоиш дастгирӣ намешавад')}catch(x){toast('PDF сохта нашуд')}}
function mkStamp(i){const c=$('#ex-stamp');return c&&c.checked?{name:P.name,floor:P.floors[i],date:new Date().toLocaleDateString()}:null}
function mkEx0(){return exportSVG(FO(),layers,$('#o-dims').checked,{name:P.name,floor:P.floors[curFloor],date:new Date().toLocaleDateString()})}
function mkEx(){return exportSVG(FO(),layers,$('#o-dims').checked,mkStamp(curFloor))}
async function savePdfAll(){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('PDF сохта намешавад: китобхона бор нашуд');return}
 try{let doc=null;for(let i=0;i<P.floors.length;i++){const ex=exportSVG(objs.filter(o=>(o.fl||0)===i),layers,$('#o-dims').checked,mkStamp(i)),bl=await pngBlob({svg:ex.svg,w:ex.w*2,h:ex.h*2}),url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(bl)});
  const land=ex.cw>=ex.ch,pw=land?297:210,ph=land?210:297,m=10,k=Math.min((pw-2*m)/ex.cw,(ph-2*m-8)/ex.ch),w=ex.cw*k,h=ex.ch*k;
  if(!doc)doc=new J({orientation:land?'l':'p',unit:'mm',format:'a4'});else doc.addPage('a4',land?'l':'p');
  doc.addImage(url,'PNG',(pw-w)/2,m,w,h);doc.setFontSize(9);doc.text('#'+(i+1)+'  1 : '+Math.round(10/k),pw-m,ph-m,{align:'right'})}
  if(!(await saveFile(slug()+'.pdf',doc.output('arraybuffer'))))toast('Захираи файл дар ин намоиш дастгирӣ намешавад')}catch(x){toast('PDF сохта нашуд')}}
function openExport(){let ex=mkEx0();
 openModal('<h2>Содир кардан</h2><div class="btns"><button class="btn primary" type="button" data-ex="svg">SVG</button><button class="btn primary" type="button" data-ex="png">PNG</button><button class="btn primary" type="button" data-ex="pdf">PDF (A4)</button><button class="btn primary" type="button" data-ex="pdfall">PDF (ҳамаи ошёнаҳо)</button><button class="btn primary" type="button" data-ex="json">JSON</button></div><p style="margin:0;font-size:13px;color:var(--muted)">SVG барои таҳрир дар барномаҳои вектории ва CAD, PNG барои фиристодан, JSON нусхаи пурраи лоиҳа.'+(DL||STANDALONE?'':' Захираи файл дар ин намоиш кор намекунад, аз ин рӯ матнро нусха кунед.')+'</p><label class="chk"><input type="checkbox" id="ex-stamp" checked>Ҷадвали ном дар поёни нақша</label><textarea id="ex-ta" readonly aria-label="Матни содиршуда"></textarea><div id="ex-img"></div><div class="btns"><button class="btn" type="button" id="ex-copy">Нусха кардан</button><button class="btn" type="button" data-close>Пӯшидан</button></div>');
 const ta=$('#ex-ta');ta.value=ex.svg;let cur='svg';
 const txt=k=>k==='json'?JSON.stringify({name:P.name,objs:objs,layers:layers},null,1):ex.svg;
 $('#modal .box').onclick=async e=>{const b=e.target.closest('[data-ex]');if(!b)return;ex=mkEx();cur=b.dataset.ex;$('#ex-img').innerHTML='';if(cur==='pdf'){await savePdf(ex);return}if(cur==='pdfall'){await savePdfAll();return}
  if(cur==='png'){try{const bl=await pngBlob(ex);if(!(await saveFile(slug()+'.png',bl))){const u=URL.createObjectURL(bl);$('#ex-img').innerHTML='<img alt="Нақша" src="'+u+'" style="width:100%;border:1px solid var(--line);border-radius:8px">';toast('Тасвирро нигоҳ дошта захира кунед')}}catch(x){toast('PNG сохта нашуд')}return}
  ta.value=txt(cur);await saveFile(slug()+'.'+cur,txt(cur))};
 $('#ex-stamp').onchange=()=>{ex=mkEx();ta.value=txt(cur==='png'||cur==='pdf'||cur==='pdfall'?'svg':cur)};
 $('#ex-copy').onclick=()=>{ex=mkEx();const t=cur==='png'?ex.svg:txt(cur);const f=()=>{ta.value=t;ta.focus();ta.select();toast('Матн интихоб шуд, нусха гиред')};try{navigator.clipboard.writeText(t).then(()=>toast('Нусха шуд'),f)}catch(x){f()}}}
/* ===== projects ===== */
const defLayers=()=>{const r={};LAYERS.forEach(l=>r[l.id]={vis:true,lock:false});return r};
function seed(){const S=[[0,0],[540,0],[540,280],[380,280],[380,580],[0,580]];
 const o=[mk('wall',S,{closed:true,hatch:true}),mk('area',S.map(p=>p.slice()),{name:'Ҳуҷраи асосӣ'}),mk('dim',[[0,-60],[540,-60]]),mk('dim',[[-60,0],[-60,580]]),
  mk('window',[[150,0]]),mk('door',[[60,580]]),mk('bed',[[20,330]]),mk('table',[[300,60]]),mk('sofa',[[250,170]],{rot:0,scale:.8}),
  mk('text',[[40,90]],{text:'Ҳуҷраи намуна',size:26,rot:0})];
 return {id:uid(),name:'Хонаи намуна',example:true,updated:Date.now(),objs:o,layers:defLayers(),view:null}}
function newProject(name,tpl,w,h){const o=[];if(tpl==='room'){const W=w*100,H=h*100;o.push(mk('wall',[[0,0],[W,0],[W,H],[0,H]],{closed:true,hatch:true}))}
 return {id:uid(),name:name||'Лоиҳаи нав',updated:Date.now(),objs:o,layers:defLayers(),view:null}}
function initDB(){DB=loadDB();if(!DB||!Array.isArray(DB.projects)||!DB.projects.length){DB={projects:[seed()],current:null};saveDB(DB)}}
function renderProjects(){const q=$('#q').value.trim().toLowerCase(),list=DB.projects.filter(p=>!q||p.name.toLowerCase().indexOf(q)>=0).sort((a,b)=>b.updated-a.updated);
 $('#plist').innerHTML=list.length?list.map(p=>{const th=exportSVG(p.objs.filter(o=>!o.fl),p.layers||defLayers(),false).svg.replace(/ width="\d+" height="\d+"/,' class="thumb" role="img" aria-label="Нақша" preserveAspectRatio="xMidYMid meet"');
  const d=new Date(p.updated).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  return '<div class="card"><a class="open" href="#editor" data-open="'+p.id+'" aria-label="Кушодани '+esc(p.name)+'">'+th+'<span class="meta"><b>'+esc(p.name)+'</b><span>'+d+' · '+p.objs.length+' объект</span>'+(p.example?'<span class="tag">Намуна</span>':'')+'</span></a><div class="acts"><button class="btn" type="button" data-dup="'+p.id+'" aria-label="Нусха: '+esc(p.name)+'">Нусха</button><button class="btn danger" type="button" data-del="'+p.id+'" aria-label="Нест кардан: '+esc(p.name)+'">Нест кардан</button></div></div>'}).join(''):'<p style="color:var(--muted)">Лоиҳае нест. Тугмаи «+ Лоиҳаи нав»-ро пахш кунед.</p>'}
$('#plist').addEventListener('click',e=>{const a=e.target.closest('[data-open]');if(a){DB.current=a.dataset.open;saveDB(DB);return}
 const d=e.target.closest('[data-dup]');if(d){const p=DB.projects.find(x=>x.id===d.dataset.dup),c=JSON.parse(JSON.stringify(p));c.id=uid();c.name=p.name+' (нусха)';c.example=false;c.updated=Date.now();DB.projects.push(c);saveDB(DB);renderProjects();return}
 const x=e.target.closest('[data-del]');if(x){const p=DB.projects.find(y=>y.id===x.dataset.del);
  openModal('<h2>Нест кардани лоиҳа?</h2><p style="margin:0">«'+esc(p.name)+'» аз ин дастгоҳ хориҷ карда мешавад.</p><div class="btns"><button class="btn danger" type="button" id="del-ok">Нест кардан</button><button class="btn" type="button" data-close>Бекор</button></div>');
  $('#del-ok').onclick=()=>{DB.projects=DB.projects.filter(y=>y.id!==p.id);saveDB(DB);closeModal();renderProjects()}}});
$('#q').addEventListener('input',renderProjects);
$('#np-open').addEventListener('click',()=>{const f=$('#np-form');f.hidden=!f.hidden;if(!f.hidden)$('#np-name').focus()});
$('#np-cancel').addEventListener('click',()=>$('#np-form').hidden=true);
$('#np-form').addEventListener('submit',e=>{e.preventDefault();const p=newProject($('#np-name').value.trim(),$('#np-tpl').value,Math.min(100,Math.max(1,+$('#np-w').value||6)),Math.min(100,Math.max(1,+$('#np-h').value||4)));
 DB.projects.push(p);DB.current=p.id;saveDB(DB);$('#np-form').hidden=true;location.hash='editor';route()});
/* ===== editor open / routing ===== */
function showProjects(){if(P&&!$('#v-editor').hidden){clearTimeout(saveT);persist()}commitText(false);closeMenu();$('#v-editor').hidden=true;$('#v-projects').hidden=false;renderProjects();document.title='Студия расм'}
function openEditor(){P=DB.projects.find(p=>p.id===DB.current);if(!P){location.hash='projects';return}
 objs=P.objs;layers=Object.assign(defLayers(),P.layers||{});P.layers=layers;sel=null;draft=null;cur=null;tool='select';hist=[JSON.stringify(objs)];hi=0;ptab='props';panelOpen=false;curFloor=0;P.floors=P.floors||['Ошёнаи 1'];fillFloors();
 $('#v-projects').hidden=true;$('#v-editor').hidden=false;$('#pname').value=P.name;document.title=P.name+' · Студия расм';
 buildTools();syncPanel();updUndo();requestAnimationFrame(()=>{if(P.view&&P.view.z)view=P.view;else fit();renderWorld();renderPanel();updHint()})}
function route(){const h=location.hash.slice(1);if(h==='editor'&&DB.current&&DB.projects.some(p=>p.id===DB.current))openEditor();else showProjects()}
window.addEventListener('hashchange',route);
/* ===== wiring ===== */
$('#pname').addEventListener('input',e=>{P.name=e.target.value.trim()||'Лоиҳа';schedSave()});
$('#b-undo').addEventListener('click',()=>undo(-1));$('#b-redo').addEventListener('click',()=>undo(1));
const zc=k=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,k)};
$('#b-zi').addEventListener('click',()=>zc(1.25));$('#b-zo').addEventListener('click',()=>zc(.8));$('#b-fit').addEventListener('click',fit);
$('#b-exp').addEventListener('click',openExport);
$('#btn-panel').addEventListener('click',()=>{panelOpen=!panelOpen;syncPanel()});
$('#o-dims').addEventListener('change',()=>{renderWorld();renderDraft()});
window.addEventListener('resize',()=>{syncPanel();if(!$('#v-editor').hidden)renderWorld()});
window.addEventListener('pagehide',()=>{if(P&&!$('#v-editor').hidden){clearTimeout(saveT);persist()}});
function fillFloors(){const s=$('#fl-sel');s.innerHTML=P.floors.map((n,i)=>'<option value="'+i+'"'+(i===curFloor?' selected':'')+'>'+esc(n)+'</option>').join('');$('#fl-del').disabled=P.floors.length<2}
function gotoFloor(i){commitText(false);draft=null;cur=null;sel=null;curFloor=i;fillFloors();renderWorld();renderPanel();updHint();renderDraft()}
$('.flpop').addEventListener('click',e=>{if(e.target.closest('button'))$('.flm').open=false});
$('#fl-ren').addEventListener('click',()=>{openModal('<h2>Номи ошёна</h2><form id="fl-form" class="fld"><input id="fl-name" value="'+esc(P.floors[curFloor])+'" maxlength="40" aria-label="Номи ошёна"><div class="btns"><button class="btn primary" type="submit">Захира кардан</button><button class="btn" type="button" data-close>Бекор</button></div></form>');
 $('#fl-form').onsubmit=e=>{e.preventDefault();const v=$('#fl-name').value.trim();if(v){P.floors[curFloor]=v;fillFloors();schedSave()}closeModal()}});
$('#fl-sel').addEventListener('change',e=>gotoFloor(+e.target.value));
$('#fl-add').addEventListener('click',()=>{P.floors.push('Ошёнаи '+(P.floors.length+1));gotoFloor(P.floors.length-1);schedSave()});
$('#fl-dup').addEventListener('click',()=>{const src=FO().map(o=>{const c=JSON.parse(JSON.stringify(o));c.id=uid();return c});P.floors.push('Ошёнаи '+(P.floors.length+1));const n=P.floors.length-1;src.forEach(c=>{c.fl=n;objs.push(c)});gotoFloor(n);changed(true);toast('Нусхаи ошёна сохта шуд')});
$('#fl-del').addEventListener('click',()=>{if(P.floors.length<2)return;const i=curFloor;openModal('<h2>Нест кардани ошёна?</h2><p style="margin:0">«'+esc(P.floors[i])+'» бо ҳамаи объектҳояш хориҷ карда мешавад.</p><div class="btns"><button class="btn danger" type="button" id="fl-ok">Нест кардан</button><button class="btn" type="button" data-close>Бекор</button></div>');
 $('#fl-ok').onclick=()=>{objs=objs.filter(o=>(o.fl||0)!==i);objs.forEach(o=>{if((o.fl||0)>i)o.fl=o.fl-1});P.floors.splice(i,1);closeModal();gotoFloor(Math.max(0,i-1));changed(true)}});
initDB();
if(location.hash==='#editor'&&!DB.current)location.hash='projects';
route();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
