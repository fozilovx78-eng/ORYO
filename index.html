/* Layout: one white top chrome (brand, project name, actions, tool dock) over a cool grey desk;

  --ink:#16212C;--muted:#566474;--line:#D6DCE3;

  --font:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

}

  --c-ink:#E8EEF4;--c-accent:#F28A4B;--c-blue:#6FA3FF;--c-green:#6CC48F;--c-red:#FF8A7A;--c-yellow:#F5C842;--c-lime:#A5D65A;--c-teal:#4FD1C5;--c-sky:#6CC6F2;--c-purple:#B58CFF;--c-pink:#FF8FB5;--c-brown:#C99A6E;--c-gray:#A9B4C0;--c-navy:#8E9CFF;color-scheme:dark}}

*{box-sizing:border-box}

button,summary{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#app{height:100%;position:relative}
.view{height:100%;display:flex;flex-direction:column;min-height:0}

@media (max-width:640px){.v3t{display:none}}

#v3c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.btn{min-height:44px;min-width:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px}

.lm{position:relative;display:flex;justify-content:flex-end}.lm-b{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--raised);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}.lm-p{position:absolute;right:0;top:48px;z-index:20;width:min(300px,86vw);padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--raised);box-shadow:0 12px 32px rgba(0,0,0,.28)}.lm-p[hidden]{display:none}.lm-h{font-size:12px;color:var(--muted);margin:2px 2px 6px}.lm-h:not(:first-child){margin-top:12px}.lm-r{display:flex;gap:6px}.lm-r button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer}.lm-r button.on{background:var(--accent);border-color:var(--accent);color:#14110D;font-weight:700}
.lang-sel{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--raised);color:var(--ink);font:inherit;font-size:14px;max-width:130px}

.status.open{gap:10px;padding:20px 16px 16px;max-height:calc(100dvh - 24px);overflow:auto!important}
.status.open .stt{font-size:20px;font-weight:700;margin:0 4px 2px;color:var(--ink)}
.status.open .sg.thm,.status.open .sg.tgl{background:var(--soft);border-radius:14px;padding:6px 12px 6px 14px;min-height:54px;justify-content:space-between;width:100%;box-sizing:border-box;gap:12px;flex-wrap:nowrap}
.status.open .thl{font-size:15px;color:var(--ink)}
.status.open .thb{background:var(--raised)}
.status.open .thb button{padding:0 11px}
.status.open .tgl .chk{width:100%;display:flex;justify-content:space-between;align-items:center;margin:0;font-size:15px!important;color:var(--ink)}
.status.open .tgl input[type=checkbox]{appearance:none;-webkit-appearance:none;width:50px!important;height:30px!important;border-radius:999px;background:var(--line);border:0;position:relative;transition:background .15s;flex:none;margin:0;order:2}
.status.open .tgl input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.status.open .tgl input[type=checkbox]:checked{background:var(--accent)}

/* projects home */
.pv{overflow:auto;padding-block:24px 40px;padding-left:var(--gx);padding-right:var(--gxr)}
.pv-head{width:100%;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto 20px}
.pv-head .ttl{display:flex;align-items:center;gap:12px;min-width:0}
.pv-head h1{margin:0;font-size:24px;line-height:30px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.pv-head p{margin:0;font-size:13px;color:var(--muted)}
.pv-body{max-width:1080px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.search{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--raised);color:var(--ink)}
.search{border:2px solid var(--muted);border-radius:12px;box-sizing:border-box}
.search:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--raised);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card a.open{display:block;color:inherit;text-decoration:none}
.thumb{height:150px;background:#fff;border-bottom:1px solid var(--line);display:block;width:100%}
.card .meta{padding:12px 14px 6px;display:flex;flex-direction:column;gap:2px}
.card .meta b{font-size:16px;overflow-wrap:anywhere}
.card .meta span{font-size:13px;color:var(--muted)}
.card .acts{display:flex;gap:6px;padding:4px 10px 10px;justify-content:flex-end}
.card .acts .btn{min-height:36px;padding:0 12px;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);width:fit-content;margin-top:4px}
.form{border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form input,.form select,.fld input,.fld select{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.form .full{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
/* editor chrome */
.chrome{background:var(--chrome);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:8px var(--gxr) 4px var(--gx);flex-wrap:wrap}

.sbtn{width:40px;height:40px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}

.sbtn.on,.sbtn.on:hover:not([disabled]){background:var(--accent);color:#fff}.sbtn.on .ic{stroke:#fff}
.sbtn[disabled]{opacity:.35;cursor:default}
.zl{min-width:46px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.acts-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:6px;padding:4px var(--gxr) 8px var(--gx);overflow-x:auto;scrollbar-width:none;align-items:stretch}
.tools::-webkit-scrollbar{display:none}
.tb{position:relative;min-width:68px;height:58px;padding:6px 8px 4px;border:1.5px solid var(--line);border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none;color:var(--muted)}
.tb .tl{font-size:11.5px;font-weight:600;line-height:1;white-space:nowrap}
.tb:hover{background:var(--soft);color:var(--ink)}
.tb.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tb:hover{border-color:var(--muted)}
.tb .car{position:absolute;right:6px;top:7px;width:9px;height:9px;opacity:.55}
.tb.sel0{position:relative}
.tb.sel0::after{display:none}
.menu{position:fixed;z-index:30;min-width:230px;max-height:70%;overflow:auto;padding:6px;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px var(--shadow)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left}
.menu button:hover,.menu button.on{background:color-mix(in srgb,var(--accent) 20%,var(--raised))}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* desk */
.work{flex:1;min-height:0;display:flex;gap:12px;position:relative;padding:12px var(--gxr) 4px var(--gx)}
#stage{flex:1;min-width:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hint{position:absolute;left:12px;right:12px;top:10px;bottom:10px;align-content:flex-start;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;pointer-events:none}

/* status */
.status{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap;padding:4px var(--gxr) 8px var(--gx);font-size:12.5px;color:var(--muted)}
.sg{display:flex;align-items:center;gap:14px}
.status .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.status .sg.fl,.status.open .sg.fl{display:none!important}
.thb{display:inline-flex;padding:3px;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:12px}

.thl{font-size:13px}
.status:not(.open) .thm{display:none}
.status.open .thm{width:100%;justify-content:space-between}
.status select{height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);max-width:150px}
.ls{display:none}.chk{display:inline-flex;align-items:center;gap:6px;min-height:36px}

.fl{gap:6px}
.flm{position:relative}

.flpop{position:absolute;bottom:calc(100% + 6px);left:0;z-index:25;min-width:200px;padding:6px;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px var(--shadow)}

svg.addEventListener('pointerdown',e=>{
 if(!$('#tin').hidden){commitText(true)}

  if(multi){const id=pickId(e);if(id){const was=msel.has(id);if(!was){msel.add(id);renderSel();renderPanel();updHint();startPan(e);return}drag={kind:'mm',start:w,was,id,orig:JSON.stringify(objs.filter(o=>msel.has(o.id)).map(o=>[o.id,o.pts]))};renderSel();renderPanel();updHint()}else{drag={kind:'mq',start:w,x:e.clientX,y:e.clientY};}return}

   if(o&&!o.img&&o.type!=='sym'&&ROT_T.includes(o.type)){if(o.type==='rect'||o.type==='tri'){o.pts=shapePts(o).map(q=>q.slice());o.type='poly';o.closed=true}const c=rotC(o,bbox(o));drag={kind:'rot2',c:c,a0:Math.atan2(w[1]-c[1],w[0]-c[0]),orig:JSON.stringify(o.pts),rot0:o.rot||0};return}

  const id=pickId(e);
  if(id){const was=sel===id;sel=id;const o=objs.find(q=>q.id===id);if(was&&!o.lock)drag={kind:'m',start:w,orig:JSON.stringify(o.pts)};else startPan(e);renderSel();renderPanel();syncPanel()}

svg.addEventListener('pointermove',e=>{
 const pp=pointers.get(e.pointerId);if(pp){pp.x=e.clientX;pp.y=e.clientY}
 const w=toWorld(e);$('#st-xy').textContent=fmtL(w[0])+' · '+fmtL(w[1]);
 if(gest&&pointers.size>=2){const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,r=svg.getBoundingClientRect();
  const z=Math.min(6,Math.max(.03,gest.v.z*d/gest.d)),f=z/gest.v.z,ox=gest.mx-r.left,oy=gest.my-r.top;
  view={x:(mx-r.left)-(ox-gest.v.x)*f,y:(my-r.top)-(oy-gest.v.y)*f,z:z};renderWorld();renderDraft();return}
 if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)down.moved=true;
 if(drag){
  if(drag.kind==='pan'){view={x:drag.vx+e.clientX-drag.sx,y:drag.vy+e.clientY-drag.sy,z:view.z};renderWorld();renderDraft();return}
  if(drag.kind==='mq'){if(down.moved){let r=$('#mqr');if(!r){r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.id='mqr';r.setAttribute('fill','rgba(31,95,191,.12)');r.setAttribute('stroke','#1F5FBF');r.setAttribute('stroke-dasharray','6 4');r.setAttribute('pointer-events','none');$('#ws').appendChild(r)}const s0=drag.start;r.setAttribute('x',Math.min(s0[0],w[0]));r.setAttribute('y',Math.min(s0[1],w[1]));r.setAttribute('width',Math.abs(w[0]-s0[0]));r.setAttribute('height',Math.abs(w[1]-s0[1]));r.setAttribute('stroke-width',1.5/view.z)}return}
  if(drag.kind==='mm'){if(down.moved){let dx=w[0]-drag.start[0],dy=w[1]-drag.start[1];if($('#o-snap').checked){dx=Math.round(dx/10)*10;dy=Math.round(dy/10)*10}JSON.parse(drag.orig).forEach(([id,pts])=>{const q=objs.find(o=>o.id===id);if(q)q.pts=pts.map(p=>[p[0]+dx,p[1]+dy])});renderWorld();renderSel()}return}
  const o=objs.find(q=>q.id===sel);if(!o)return;
  if(drag.kind==='m'&&down.moved){let dx=w[0]-drag.start[0],dy=w[1]-drag.start[1];if($('#o-snap').checked){dx=Math.round(dx/10)*10;dy=Math.round(dy/10)*10}
   const op=JSON.parse(drag.orig);o.pts=op.map(p=>[p[0]+dx,p[1]+dy]);renderWorld();return}
  if(drag.kind==='h'){const op=JSON.parse(drag.orig);o.pts=op.map(p=>p.slice());if(rectKind(o)==='r4'){o.pts=rectCorner(op,drag.i,snapPt(w,null,{id:o.id,all:true}))}else o.pts[drag.i]=snapPt(w,o.pts[drag.i-1]||o.pts[drag.i+1],{id:o.id,i:drag.i});drag.moved=true;renderWorld();renderSel();return}
  if(drag.kind==='rot2'){if(!down.moved)return;const a=Math.atan2(w[1]-drag.c[1],w[0]-drag.c[0]);let dg=(a-drag.a0)*180/Math.PI;if($('#o-snap').checked)dg=Math.round(dg/15)*15;
   if(o.type==='text'){let d=drag.rot0+dg;o.rot=((d%360)+360)%360}else{const r=dg*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r),c=drag.c;o.pts=JSON.parse(drag.orig).map(q=>{const dx=q[0]-c[0],dy=q[1]-c[1];return [Math.round((c[0]+dx*cs-dy*sn)*10)/10,Math.round((c[1]+dx*sn+dy*cs)*10)/10]})}
   renderWorld();renderSel();return}
  if(drag.kind==='rot'){if(!down.moved)return;const a=Math.atan2(w[1]-drag.c[1],w[0]-drag.c[0]);let d=drag.rot0+(a-drag.a0)*180/Math.PI;if($('#o-snap').checked)d=Math.round(d/15)*15;d=((d%360)+360)%360;o.rot=d;const r=d*Math.PI/180;o.pts[0]=[Math.round((drag.c[0]-drag.xm*Math.cos(r)+drag.ym*Math.sin(r))*10)/10,Math.round((drag.c[1]-drag.xm*Math.sin(r)-drag.ym*Math.cos(r))*10)/10];renderWorld();renderSel();return}
  if(drag.kind==='r'){if(!down.moved)return;symResize(o,drag.id,w,drag.orig);renderWorld();renderSel();return}
  if(drag.kind==='e'){if(!down.moved)return;const op=JSON.parse(drag.orig),k=rectKind(o),sn=$('#o-snap').checked,r=v=>Math.round(v*10)/10;
   if(k==='r4'){const j=drag.id,a=op[j],b=op[(j+1)%4],d=Math.hypot(b[0]-a[0],b[1]-a[1])||1,nx=-(b[1]-a[1])/d,ny=(b[0]-a[0])/d;let dl=(w[0]-drag.start[0])*nx+(w[1]-drag.start[1])*ny;if(sn)dl=Math.round(dl/10)*10;
    o.pts=op.map(p=>p.slice());o.pts[j]=[r(a[0]+nx*dl),r(a[1]+ny*dl)];o.pts[(j+1)%4]=[r(b[0]+nx*dl),r(b[1]+ny*dl)]}
   else if(k==='r2'){const bx=r2box(op),id=drag.id;let v=id==='L'?bx[0]+w[0]-drag.start[0]:id==='R'?bx[2]+w[0]-drag.start[0]:id==='T'?bx[1]+w[1]-drag.start[1]:bx[3]+w[1]-drag.start[1];if(sn)v=Math.round(v/10)*10;v=r(v);
    const ix=(id==='L'||id==='R')?0:1,old=id==='L'||id==='T'?(ix?bx[1]:bx[0]):(ix?bx[3]:bx[2]);o.pts=op.map(p=>{const q=p.slice();if(Math.abs(q[ix]-old)<.01)q[ix]=v;return q})}
   renderWorld();renderSel();return}
  return}
 if(draft&&draft.free){const l=draft.pts[draft.pts.length-1];if(dist(w,l)>5/view.z){draft.pts.push(w);renderDraft()}return}

function endPtr(e){
 const had=pointers.has(e.pointerId);pointers.delete(e.pointerId);
 if(gest){if(pointers.size<2){gest=null;schedSave()}return}
 if(!had)return;
 const w=toWorld(e);
 if(drag){const dd=drag;drag=null;
  if(dd.kind==='mq'){const r=$('#mqr');if(r)r.remove();if(down.moved){const x0=Math.min(dd.start[0],w[0]),x1=Math.max(dd.start[0],w[0]),y0=Math.min(dd.start[1],w[1]),y1=Math.max(dd.start[1],w[1]);FO().forEach(o=>{const st=layers[o.layer];if(!st||!st.vis||st.lock)return;const b=bbox(o);if(b[0]<=x1&&b[2]>=x0&&b[1]<=y1&&b[3]>=y0)msel.add(o.id)});renderSel();renderPanel();updHint()}return}
  if(dd.kind==='mm'){if(down.moved){objs.forEach(o=>{if(msel.has(o.id)&&isOpen(o)){const wm=o.at&&msel.has(o.at.id);if(!wm)linkOpening(o)}});changed(true)}else if(dd.was){msel.delete(dd.id);renderSel();renderPanel();updHint()}return}
  if(dd.kind==='pan'){schedSave();if(tool==='select'&&!down.moved&&!sel)renderPanel();return}
  if(dd.kind==='rot'||dd.kind==='rot2'){if(down.moved)changed(true);else if(dd.kind==='rot2')changed(true);return}
  if(dd.kind==='r'){const so=objs.find(q=>q.id===sel);if(down.moved){if(isOpen(so))linkOpening(so);changed(true)}return}
  if(dd.kind==='sl'){if(!down.moved){const so=objs.find(q=>q.id===dd.o);if(so){sel=so.id;renderSel();renderPanel();openSegEdit(so,dd.i)}}return}
  if(dd.kind==='e'){const so=objs.find(q=>q.id===sel);if(down.moved)changed(true);else if(so&&rectKind(so))openSideEdit(so,dd.id);return}
  if((dd.kind==='m'&&down.moved)||(dd.kind==='h'&&dd.moved)){const so=objs.find(q=>q.id===sel);if(dd.kind==='m'&&isOpen(so))linkOpening(so);changed(true)}return}
 if(!down)return;
 if(tool==='room'&&!down.moved){autoRoom(w);down=null;return}
 if(tool==='text'&&!down.moved){placeText(w);down=null;return}
 if(SYM[tool]&&!down.moved){const o=mk(tool,[snapPt(w)]);objs.push(o);if(isOpen(o))linkOpening(o);sel=o.id;tool='select';buildTools();changed(true);updHint();down=null;return}
 if(draft&&draft.free){const pts=simplifyPts(draft.pts,3/view.z);draft=null;cur=null;if(pts.length>1&&down.moved){const o=mk('free',pts.map(q=>[Math.round(q[0]*10)/10,Math.round(q[1]*10)/10]));objs.push(o);sel=o.id;tool='select';buildTools();changed(true)}updHint();renderDraft();down=null;return}
 if(NPTS[tool]){
  if(draft&&draft.drag){draft.drag=false;if(down.moved){const p=snapPt(w,draft.pts[0]);if(dist(p,draft.pts[0])>2){const o=mk(tool,[draft.pts[0],p]);objs.push(o);draft=null;sel=o.id;cur=null;tool='select';buildTools();changed(true);updHint()}else cancel()}else{updHint();renderDraft()}}
  else if(!down.moved){
   const now=Date.now(),dbl=NPTS[tool]==='n'&&lastTap&&now-lastTap.t<400&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<14;
   if(dbl&&draft){lastTap=null;finish(false)}else{addPoint(w);lastTap={t:now,x:e.clientX,y:e.clientY}}}}

  catch(x){toast('Файл дуруст нест. JSON-и ин барнома лозим аст')}};

const AK='oryo-acct',AS='oryo-sess';
const AUTH_ON=()=>typeof STANDALONE!=='undefined'&&STANDALONE&&!!(window.crypto&&crypto.subtle);
function getAcct(){try{return JSON.parse(localStorage.getItem(AK))}catch(e){return null}}
function loggedIn(){try{return sessionStorage.getItem(AS)==='1'||localStorage.getItem(AS)==='1'}catch(e){return false}}
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function hashPw(pw,saltB){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(saltB),iterations:150000,hash:'SHA-256'},k,256)))}
const rndSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
function mkCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));let c='';r.forEach((v,i)=>{c+=A[v%A.length];if(i%4===3&&i<11)c+='-'});return c}
let AMODE='new';
function authSet(m){AMODE=m;const a=getAcct(),V=(id,on)=>{$(id).hidden=!on};
 V('#au-l-email',m==='new'||m==='login');V('#au-l-code',m==='reset');V('#au-l-pw',true);V('#au-l-pw2',m==='new'||m==='reset');V('#au-l-rem',m==='login'||m==='new'||m==='reset');
 $('#au-err').hidden=true;$('#au-pw').value='';$('#au-pw2').value='';$('#au-code').value='';
 $('#au-pw').autocomplete=m==='login'?'current-password':'new-password';
 $('#au-sub').textContent=m==='new'?'Ҳисоби нав созед':m==='login'?'Ба барнома ворид шавед':'Тағйири парол';
 $('#au-pwl').textContent=m==='reset'?'Пароли нав':m==='new'?'Парол созед (камаш 6 аломат)':'Парол';
 $('#au-go').textContent=m==='new'?'Сохтани ҳисоб':m==='login'?'Ворид шудан':'Нигоҳ доштани пароли нав';
 const a1=$('#au-alt1'),a2=$('#au-alt2');a1.hidden=a2.hidden=false;
 if(m==='login'){a1.textContent='Парол фаромӯш шуд';a1.dataset.m='reset';a2.hidden=true}
 else if(m==='reset'){a1.textContent='Бозгашт';a1.dataset.m='login';a2.textContent='Рамз нест';a2.dataset.m='wipe'}
 else{a1.hidden=true;a2.hidden=true}
 if(a&&m==='login')$('#au-email').value=a.email||''}
/* Face ID / Touch ID: WebAuthn (platform authenticator). Танҳо дар ҳамин дастгоҳ. */
const FK='oryo-fid',FNO='oryo-fid-no';
const fidGet=()=>{try{return JSON.parse(localStorage.getItem(FK))}catch(e){return null}};
let FID_OK=false;
try{if((location.protocol==='https:'||location.hostname==='localhost')&&window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(v=>{FID_OK=!!v;fidUi()}).catch(()=>{})}catch(e){}
function fidUi(){const f=fidGet(),a=getAcct(),on=FID_OK&&f&&a&&f.email===a.email;const b=$('#au-fid');if(b)b.hidden=!(on&&AMODE==='login');const t=$('#b-fid');if(t){t.hidden=!(AUTH_ON()&&a&&FID_OK);t.textContent=on?'Face ID: фаъол':'Face ID: хомӯш';t.classList.toggle('on',!!on)}}
async function fidEnable(){const a=getAcct();if(!a||!FID_OK)return false;try{const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'ORYO',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:a.email,displayName:a.email},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
  localStorage.setItem(FK,JSON.stringify({id:b64(new Uint8Array(cr.rawId)),email:a.email}));localStorage.removeItem(FNO);fidUi();toast('Face ID фаъол шуд');return true}catch(e){toast('Face ID фаъол нашуд');return false}}
async function fidLogin(){const f=fidGet();if(!f)return;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64(f.id)}],userVerification:'required',timeout:60000}});authDone(true)}catch(e){authErr('Face ID кор накард. Бо парол ворид шавед.')}}

 openModal('<h2>Face ID-ро фаъол мекунед?</h2><p style="margin:0">Дафъаи дигар бе парол, бо Face ID ворид мешавед. Ин танҳо дар ҳамин дастгоҳ кор мекунад.</p><div class="btns"><button class="btn" type="button" id="fid-no">Ҳозир не</button><button class="btn primary" type="button" id="fid-yes">Фаъол кардан</button></div>');
 $('#fid-no').onclick=()=>{try{localStorage.setItem(FNO,'1')}catch(e){}closeModal()};$('#fid-yes').onclick=async()=>{closeModal();await fidEnable()}}

function showCode(code,rem){openModal('<h2>Рамзи барқарорӣ</h2><p style="margin:0">Ин рамзро ҳатман ҷое нависед ё скриншот гиред. Агар паролро фаромӯш кунед, танҳо бо ҳамин рамз онро иваз мекунед. Он дубора нишон дода намешавад.</p><p style="font:700 22px ui-monospace,monospace;letter-spacing:.06em;text-align:center;margin:12px 0;user-select:all">'+code+'</p><div class="btns"><button class="btn" type="button" id="rc-copy">Нусха кардан</button><button class="btn primary" type="button" id="rc-ok">Навишт, идома</button></div>');

$('#au-form').addEventListener('submit',async e=>{e.preventDefault();const em=$('#au-email').value.trim().toLowerCase(),pw=$('#au-pw').value,pw2=$('#au-pw2').value,rem=$('#au-rem').checked,a=getAcct();
 try{
 if(AMODE==='new'){if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return authErr('Почтаро дуруст нависед');if(pw.length<6)return authErr('Парол камаш 6 аломат');if(pw!==pw2)return authErr('Паролҳо мувофиқ нестанд');
  const salt=rndSalt(),code=mkCode(),salt2=rndSalt();localStorage.setItem(AK,JSON.stringify({email:em,salt,hash:await hashPw(pw,salt),salt2,rhash:await hashPw(code.replace(/-/g,''),salt2)}));showCode(code,rem)}
 else if(AMODE==='login'){if(!a)return authSet('new');if(em!==a.email)return authErr('Почта нодуруст аст');if(await hashPw(pw,a.salt)!==a.hash)return authErr('Парол нодуруст аст');authDone(rem)}
 else if(AMODE==='reset'){const code=$('#au-code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!a)return authSet('new');if(await hashPw(code,a.salt2)!==a.rhash)return authErr('Рамзи барқарорӣ нодуруст аст');if(pw.length<6)return authErr('Пароли нав камаш 6 аломат');if(pw!==pw2)return authErr('Паролҳо мувофиқ нестанд');
  const salt=rndSalt();a.salt=salt;a.hash=await hashPw(pw,salt);localStorage.setItem(AK,JSON.stringify(a));toast('Парол иваз шуд');authDone(rem)}
 }catch(err){authErr('Хатогӣ: '+(err&&err.message||err))}});
